<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ASTRO · Deep Space</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:480px; height:480px; overflow:hidden; }
  body {
    position:relative;
    background:
      radial-gradient(circle at 50% 52%, #0A1730 0%, #050B18 38%, #02040A 72%, #010206 100%);
    font-family:"Avenir Next","Helvetica Neue",sans-serif;
  }
  /* 圆形安全区：所有内容都在 R≈235 内 */
  .stage { position:absolute; inset:0; overflow:hidden; border-radius:50%; }

  /* ---------- 星云 / 光斑（烘焙层） ---------- */
  .neb { position:absolute; border-radius:50%; filter:blur(26px); mix-blend-mode:screen; }
  .neb.n1 { width:340px; height:300px; left:-70px; top:-60px;
            background:radial-gradient(circle, rgba(40,120,255,.34) 0%, rgba(30,80,190,.16) 45%, transparent 72%); }
  .neb.n2 { width:300px; height:280px; right:-80px; top:20px;
            background:radial-gradient(circle, rgba(120,90,255,.26) 0%, rgba(70,50,170,.12) 50%, transparent 74%); }
  .neb.n3 { width:360px; height:320px; left:-40px; bottom:-110px;
            background:radial-gradient(circle, rgba(0,190,255,.22) 0%, rgba(0,120,200,.10) 50%, transparent 74%); }
  .neb.n4 { width:240px; height:220px; right:-40px; bottom:-70px;
            background:radial-gradient(circle, rgba(190,120,255,.16) 0%, rgba(120,70,190,.08) 50%, transparent 74%); }
  .neb.n5 { width:480px; height:480px; left:0; top:0;
            background:radial-gradient(circle at 50% 50%, rgba(90,170,255,.10) 0%, transparent 62%); }

  /* ---------- 星点 ---------- */
  .star { position:absolute; border-radius:50%; background:#DFF1FF; }
  .star.bright { box-shadow:0 0 6px 1px rgba(160,220,255,.55); }

  /* ---------- 行星 / 卫星 ---------- */
  .planet {
    position:absolute; width:420px; height:420px; left:-190px; bottom:-210px;
    border-radius:50%;
    background:radial-gradient(circle at 68% 30%, #0C1B33 0%, #071021 45%, #02040A 78%);
    box-shadow: inset -18px -22px 60px rgba(90,170,255,.16);
  }
  .planet::after {
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:radial-gradient(circle at 72% 26%, rgba(140,215,255,.60) 0%, rgba(90,170,255,.18) 7%, transparent 20%);
  }
  .moon {
    position:absolute; width:54px; height:54px; right:52px; top:96px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #E8F4FF 0%, #9FC4E8 28%, #3C5A7A 72%, #1A2A40 100%);
    box-shadow:0 0 24px 4px rgba(140,200,255,.22);
    opacity:.85;
  }

  /* ---------- 轨道环（SVG） ---------- */
  .rings { position:absolute; inset:0; }
  .rings ellipse { fill:none; }

  /* ---------- 中心光晕（宇航员背后） ---------- */
  .halo {
    position:absolute; left:50%; top:52%; width:330px; height:330px;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle, rgba(120,205,255,.20) 0%, rgba(60,140,255,.10) 38%, rgba(30,70,160,.05) 58%, transparent 72%);
    filter:blur(6px); mix-blend-mode:screen;
  }
  .halo-core {
    position:absolute; left:50%; top:52%; width:150px; height:150px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(200,240,255,.26) 0%, rgba(120,200,255,.10) 45%, transparent 70%);
    mix-blend-mode:screen;
  }

  /* ---------- 边缘刻线环 ---------- */
  .ticks { position:absolute; inset:0; }

  /* ---------- HUD（烘焙文字） ---------- */
  .hud { position:absolute; left:0; width:480px; text-align:center;
         font-size:10px; letter-spacing:4px; color:rgba(178,208,240,.55);
         text-transform:uppercase; font-weight:500; }
  .hud.top { top:26px; }
  .hud.bottom { bottom:20px; letter-spacing:5px; color:rgba(178,208,240,.48); }
  .hud.micro { font-size:8px; letter-spacing:2px; color:rgba(150,185,220,.38); }
  .hud.micro.l { left:58px; top:396px; width:120px; text-align:left; }
  .hud.micro.r { left:302px; top:396px; width:120px; text-align:right; }

  .line { position:absolute; left:120px; width:240px; height:1px; bottom:38px;
          background:linear-gradient(90deg, transparent, rgba(150,200,255,.5), transparent); }

  /* ---------- 动态层（LVGL 绘制，bake 时隐藏） ---------- */
  .sp-time {
    position:absolute; left:0; width:480px; top:54px; text-align:center;
    font-family:"DIN Condensed", "DIN Alternate", "Avenir Next Condensed", sans-serif;
    font-weight:700; font-size:78px; line-height:1; letter-spacing:2px;
    color:#F2F8FF; text-shadow:0 0 18px rgba(120,200,255,.35);
  }
  .sp-date {
    position:absolute; left:0; width:480px; top:142px; text-align:center;
    font-size:11px; letter-spacing:5px; color:rgba(196,220,245,.72); font-weight:500;
  }
  .sp-status {
    position:absolute; left:0; width:480px; bottom:54px; text-align:center;
    font-size:11px; letter-spacing:5px; color:rgba(196,220,245,.75); font-weight:500;
  }
  .sp-status b { color:#67F5C8; font-weight:600; }
  .dyn-fg { visibility:visible; }
  body.mode-bake_bg .dyn-fg { visibility:hidden; }


  /* ---------- 跃迁（warp）变体：只在 bake_bg&warp=1 时可见 ---------- */
  body.mode-warp .neb { filter:blur(26px) brightness(1.35); }
  body.mode-warp .halo { opacity:1.2; }
  .warp-layer { display:none; position:absolute; inset:0; }
  body.mode-warp .warp-layer { display:block; }
  body.mode-bake_bg .warp-layer { display:none; }
  body.mode-bake_bg.mode-warp .warp-layer { display:block; }

  /* 圆屏安全区调试 */
  body.debug-safe .safe-ring {
    display:block;
  }
  .safe-ring { display:none; position:absolute; left:14px; top:14px; width:452px; height:452px;
               border-radius:50%; border:1px dashed rgba(255,80,80,.8); }
</style>
</head>
<body class="mode-full">

<!-- 星云 -->
<div class="neb n5"></div>
<div class="neb n1"></div>
<div class="neb n2"></div>
<div class="neb n3"></div>
<div class="neb n4"></div>

<!-- 星点（JS 生成，烘焙进底图） -->
<div id="stars"></div>

<!-- 行星 / 卫星 -->
<div class="planet"></div>
<div class="moon"></div>

<!-- 中心光晕 -->
<div class="halo"></div>
<div class="halo-core"></div>

<!-- 轨道环 -->
<svg class="rings" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD0FF" stop-opacity="0"/>
      <stop offset=".35" stop-color="#8FD8FF" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#CFEFFF" stop-opacity=".55"/>
      <stop offset=".8" stop-color="#6FB6FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5A9CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B79BFF" stop-opacity="0"/>
      <stop offset=".4" stop-color="#9C8BFF" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#E4D9FF" stop-opacity=".42"/>
      <stop offset=".85" stop-color="#7A6CFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6A5BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-18 240 240)">
    <ellipse cx="240" cy="244" rx="150" ry="56" stroke="url(#ring1)" stroke-width="1.2"/>
  </g>
  <g transform="rotate(14 240 240)">
    <ellipse cx="240" cy="240" rx="196" ry="78" stroke="url(#ring2)" stroke-width="1"
             stroke-dasharray="2 7" opacity=".8"/>
  </g>
</svg>


<!-- 跃迁星流（仅 warp 变体烘焙进第二张底图） -->
<svg class="warp-layer" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <radialGradient id="streak" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#CFE9FF" stop-opacity="0"/>
      <stop offset=".55" stop-color="#9FD4FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7FB8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="url(#streak)" stroke-width="1.4" opacity=".75">
    <line x1="240" y1="240" x2="40" y2="60"/>
    <line x1="240" y1="240" x2="440" y2="70"/>
    <line x1="240" y1="240" x2="20" y2="300"/>
    <line x1="240" y1="240" x2="460" y2="320"/>
    <line x1="240" y1="240" x2="120" y2="470"/>
    <line x1="240" y1="240" x2="380" y2="470"/>
    <line x1="240" y1="240" x2="70" y2="170"/>
    <line x1="240" y1="240" x2="410" y2="180"/>
  </g>
  <g opacity=".35">
    <circle cx="240" cy="240" r="150" fill="none" stroke="#B7E2FF" stroke-width="1"
            stroke-dasharray="3 9"/>
    <circle cx="240" cy="240" r="196" fill="none" stroke="#8FC8FF" stroke-width=".8"
            stroke-dasharray="24 14"/>
  </g>
</svg>

<!-- 边缘刻线 -->
<svg class="ticks" width="480" height="480" viewBox="0 0 480 480">
  <g opacity=".22">
    <circle cx="240" cy="240" r="226" fill="none" stroke="#9CC8FF" stroke-width="1"
            stroke-dasharray="1 6"/>
  </g>
  <g opacity=".30">
    <circle cx="240" cy="240" r="214" fill="none" stroke="#8FBFFF" stroke-width=".6"
            stroke-dasharray="18 12"/>
  </g>
</svg>

<!-- 烘焙 HUD -->
<div class="hud top">ASTRO&nbsp;&nbsp;//&nbsp;&nbsp;EVA-01</div>
<div class="line"></div>
<div class="hud bottom">DEEP&nbsp;SPACE&nbsp;·&nbsp;ORBIT&nbsp;07</div>
<div class="hud micro l">ALT 408 KM</div>
<div class="hud micro r">VEL 7.66 KM/S</div>

<!-- 动态层（LVGL 覆盖） -->
<div class="sp-time dyn-fg">09:41</div>
<div class="sp-date dyn-fg">SAT · 10.24</div>
<div class="sp-status dyn-fg"><b>●</b>&nbsp;&nbsp;ONLINE&nbsp;&nbsp;·&nbsp;&nbsp;EVA-01</div>

<div class="safe-ring"></div>

<script>
  // 星点：确定性伪随机，保证真值/烘焙两次渲染一致
  (function () {
    var seed = 0x5EED1234 >>> 0;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    var host = document.getElementById('stars');
    var N = 150;
    for (var i = 0; i < N; i++) {
      var x = rnd() * 480, y = rnd() * 480;
      // 圆屏安全区：画在 R=232 内
      var dx = x - 240, dy = y - 240;
      if (dx * dx + dy * dy > 232 * 232) { i--; continue; }
      var d = document.createElement('div');
      d.className = 'star';
      var r = rnd();
      var size = r < 0.72 ? 1 : (r < 0.94 ? 1.6 : 2.4);
      var op = 0.20 + rnd() * 0.62;
      d.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;' +
        'width:' + size + 'px;height:' + size + 'px;opacity:' + op.toFixed(3) + ';';
      if (r >= 0.94) { d.className += ' bright'; d.style.opacity = 0.75; }
      host.appendChild(d);
    }
  })();

  // 模式：?mode=bake_bg 隐藏动态层；?debug=safe 显示安全区
  (function () {
    var q = new URLSearchParams(location.search);
    var mode = q.get('mode') || 'full';
    document.body.className = (mode === 'bake_bg') ? 'mode-bake_bg' : 'mode-full';
    if (q.get('debug') === 'safe' || q.get('debug') === 'safe_area') {
      document.body.classList.add('debug-safe');
    }
    if (q.get('shape') === 'circle') {
      document.body.classList.add('mode-circle');
    }
    if (q.get('warp') === '1') {
      document.body.classList.add('mode-warp');
    }

  })();
</script>
</body>
</html>
